[project]
name = "nekro-plugin-private-sender-name"
version = "0.1.0"
description = "Backfill missing OneBot private-message sender names before NA processes them"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nekro_plugin_private_sender_name"]

[tool.setuptools.package-dir]
nekro_plugin_private_sender_name = "."

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
